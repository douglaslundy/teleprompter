<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>Teleprompter</title>
<style>
:root{--fs:36px;--fg:#ffffff;--bg:#000000;--hl:#ffd23f;--lh:1.35;--mx:20px;--ff:system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#setup{display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px 16px;height:100dvh}
#list{display:flex;flex-direction:column;gap:10px;padding:max(16px,env(safe-area-inset-top)) 16px 16px;height:100dvh}
#items{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{text-align:left;background:#111;border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.item b{font-size:17px}.item small{color:#999}
#est{color:#999;font-size:14px;text-align:center}
#empty{color:#999;text-align:center;margin-top:30px}
.head{display:flex;gap:8px}
#title{flex:1;min-width:0;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600}
#script{flex:1;min-height:0;width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;font-size:18px;resize:none}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
input[type=range]{flex:1}
select,button{font:inherit;color:#fff;background:#222;border:1px solid #444;border-radius:12px;padding:12px 16px}
button.main{background:#d22;border-color:#d22;font-weight:600;font-size:18px}
#run{touch-action:none;display:none;position:fixed;inset:0;background:#000}
#cam{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;background:#000}
#ov{position:absolute;left:0;right:0;top:0;height:52dvh;overflow:hidden;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent) 80%,transparent)}
#rl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 6dvh);height:calc(var(--fs)*var(--lh));background:rgba(255,255,255,.14);border-block:1px solid rgba(255,255,255,.4);display:none}
#txt{position:relative;padding:calc(env(safe-area-inset-top) + 6dvh) var(--mx) 60dvh;font-size:var(--fs);line-height:var(--lh);font-weight:600;color:var(--fg);font-family:var(--ff);will-change:transform}
#txt span.on{color:var(--hl)}
#txt span.em{text-decoration:underline;text-underline-offset:.15em;font-weight:800}
#look{font-size:15px}#look summary{padding:6px 0;color:#bbb}#look label{margin:8px 0}#look input[type=color]{width:48px;height:32px;padding:0;border:0;background:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
#bar button{padding:12px 14px;min-width:48px}
#bar button.rec{background:#d22;border-color:#d22;font-weight:600}
#msg{position:absolute;left:12px;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 120px);text-align:center;font-size:14px;color:#ffd23f;text-shadow:0 0 4px #000}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;font-weight:700;text-shadow:0 0 20px #000}
</style>
</head>
<body>
<div id="list">
  <div class="head"><button class="main" id="new" style="flex:1">+ Novo roteiro</button><button id="imp">Importar</button></div>
  <input type="file" id="file" accept=".txt,.docx,.pdf,text/plain" hidden>
  <div id="items"></div>
</div>

<div id="setup" style="display:none">
  <div class="head">
    <button id="toList">‹</button>
    <input id="title" placeholder="Título do roteiro">
    <button id="del">🗑</button>
  </div>
  <textarea id="script" placeholder="Cole ou escreva o roteiro aqui"></textarea>
  <label>Modo
    <select id="mode"><option value="speed">Velocidade</option><option value="time">Tempo fixo</option><option value="wpm">Palavras por minuto</option><option value="speech">Acompanhar minha fala</option></select>
  </label>
  <label>Letra <input id="fs" type="range" min="20" max="80" value="36"></label>
  <label id="rowSp">Velocidade <input id="sp" type="range" min="10" max="200" value="60"></label>
  <label id="rowDur">Duração (mm:ss) <input id="dur" value="2:00" inputmode="numeric" size="6"></label>
  <label id="rowWpm">Palavras/min <input id="wpm" type="number" min="40" max="400" value="140"></label>
  <label id="rowSens">Sensibilidade da fala <select id="sens"><option value="0">Rígida</option><option value="1">Normal</option><option value="2">Solta</option></select></label>
  <div id="est"></div>
  <details id="camset"><summary>Câmera</summary>
    <label>Câmera <select id="ccam"><option value="user">Frontal</option><option value="environment">Traseira</option></select></label>
    <label>Resolução <select id="cres"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select></label>
    <label>Proporção <select id="casp"><option value="9:16">9:16 vertical</option><option value="16:9">16:9 horizontal</option><option value="1:1">1:1 quadrado</option></select></label>
  </details>
  <details id="look"><summary>Aparência</summary>
    <label>Tema <select id="theme"><option value="0">Branco no escuro</option><option value="1">Amarelo no escuro</option><option value="2">Preto no branco</option><option value="3">Verde no escuro</option><option value="x">Personalizado</option></select></label>
    <label>Texto <input type="color" id="cfg" value="#ffffff"></label>
    <label>Fundo <input type="color" id="cbg" value="#000000"></label>
    <label>Destaque <input type="color" id="chl" value="#ffd23f"></label>
    <label>Entrelinha <input id="clh" type="range" min="1.1" max="2.2" step="0.05" value="1.35"></label>
    <label>Margens <input id="cmx" type="range" min="0" max="60" value="20"></label>
    <label>Espelhar horizontal <input type="checkbox" id="cmh"></label>
    <label>Espelhar vertical <input type="checkbox" id="cmv"></label>
    <label>Linha de leitura <input type="checkbox" id="crl"></label>
    <label>Fonte para dislexia <input type="checkbox" id="cdys"></label>
  </details>
  <button class="main" id="open">Abrir câmera</button>
</div>

<div id="run">
  <video id="cam" playsinline muted autoplay></video>
  <div id="ov"><div id="rl"></div><div id="txt"></div></div>
  <div id="count"></div>
  <div id="msg"></div>
  <div id="bar">
    <button id="back">✕</button>
    <button id="flip">⟲</button>
    <button id="fsm">A−</button><button id="fsp">A+</button>
    <button id="spm">−</button><button id="spp">+</button>
    <button id="pause">⏸</button>
    <button id="try">Ensaiar</button>
    <button id="rec" class="rec">● Gravar</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };

let scripts = [], cur = null;
try { scripts = JSON.parse(store('tp.scripts')) || []; } catch {}
if (!scripts.length && store('tp.script')) scripts.push({ id: Date.now(), title: 'Meu roteiro', text: store('tp.script'), at: Date.now() });
const persist = () => store('tp.scripts', JSON.stringify(scripts));
const wordCount = t => (t.trim().match(/\S+/g) || []).filter(w => w !== '//').length;

function showList() {
  cur = null;
  $('setup').style.display = 'none'; $('list').style.display = 'flex';
  const box = $('items'); box.textContent = '';
  if (!scripts.length) { const e = document.createElement('div'); e.id = 'empty'; e.textContent = 'Nenhum roteiro ainda. Toque em "Novo roteiro".'; box.append(e); }
  [...scripts].sort((a, b) => b.at - a.at).forEach(s => {
    const b = document.createElement('button'); b.className = 'item';
    const t = document.createElement('b'); t.textContent = s.title || 'Sem título';
    const m = document.createElement('small'); m.textContent = `${wordCount(s.text)} palavras · ${new Date(s.at).toLocaleDateString('pt-BR')}`;
    b.append(t, m); b.onclick = () => editScript(s.id); box.append(b);
  });
}
function editScript(id) {
  cur = scripts.find(s => s.id === id);
  $('title').value = cur.title; $('script').value = cur.text;
  $('list').style.display = 'none'; $('setup').style.display = 'flex';
  refreshSetup();
}
function saveCur() {
  if (!cur) return;
  cur.text = $('script').value;
  cur.title = $('title').value.trim() || cur.text.trim().split('\n')[0].slice(0, 40) || 'Sem título';
  cur.at = Date.now(); persist();
}
$('new').onclick = () => { const s = { id: Date.now(), title: '', text: '', at: Date.now() }; scripts.push(s); persist(); editScript(s.id); $('title').focus(); };
const themes = [['#ffffff', '#000000', '#ffd23f'], ['#ffe14d', '#000000', '#ffffff'], ['#000000', '#ffffff', '#c00000'], ['#7CFC00', '#000000', '#ffffff']];
let look = { t: 0, fg: '#ffffff', bg: '#000000', hl: '#ffd23f', lh: 1.35, mx: 20, rl: false, dys: false, mh: false, mv: false };
try { Object.assign(look, JSON.parse(store('tp.look'))); } catch {}
let dysFont = null;
function applyLook() {
  const r = document.documentElement.style;
  r.setProperty('--fg', look.fg); r.setProperty('--bg', look.bg); r.setProperty('--hl', look.hl);
  r.setProperty('--lh', look.lh); r.setProperty('--mx', look.mx + 'px');
  $('ov').style.transform = `scale(${look.mh ? -1 : 1},${look.mv ? -1 : 1})`;
  $('rl').style.display = look.rl ? 'block' : 'none';
  if (look.dys && !dysFont) {
    dysFont = new FontFace('OpenDyslexic', 'url(https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.2.5/files/opendyslexic-latin-700-normal.woff2)', { weight: '400 700' });
    dysFont.load().then(f => document.fonts.add(f)).catch(() => { dysFont = null; });
  }
  r.setProperty('--ff', (look.dys ? "'OpenDyslexic'," : '') + 'system-ui,-apple-system,sans-serif');
  $('theme').value = look.t; $('cfg').value = look.fg; $('cbg').value = look.bg; $('chl').value = look.hl;
  $('clh').value = look.lh; $('cmx').value = look.mx; $('cmh').checked = look.mh; $('cmv').checked = look.mv; $('crl').checked = look.rl; $('cdys').checked = look.dys;
  store('tp.look', JSON.stringify(look));
}
$('theme').onchange = () => { const t = $('theme').value; if (t !== 'x') { [look.fg, look.bg, look.hl] = themes[t]; look.t = +t; applyLook(); } };
[['cfg', 'fg'], ['cbg', 'bg'], ['chl', 'hl']].forEach(([id, k]) => $(id).oninput = () => { look[k] = $(id).value; look.t = 'x'; applyLook(); });
$('clh').oninput = () => { look.lh = +$('clh').value; applyLook(); };
$('cmx').oninput = () => { look.mx = +$('cmx').value; applyLook(); };
$('cmh').onchange = () => { look.mh = $('cmh').checked; applyLook(); };
$('cmv').onchange = () => { look.mv = $('cmv').checked; applyLook(); };
$('crl').onchange = () => { look.rl = $('crl').checked; applyLook(); };
$('cdys').onchange = () => { look.dys = $('cdys').checked; applyLook(); };
applyLook();

const utf8 = b => new TextDecoder().decode(b);

async function zipEntry(buf, name) {
  const v = new DataView(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('arquivo inválido');
  let p = v.getUint32(e + 16, true);
  for (let i = v.getUint16(e + 10, true); i > 0; i--) {
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true);
    if (utf8(new Uint8Array(buf, p + 46, nl)) === name) {
      const lho = v.getUint32(p + 42, true), start = lho + 30 + v.getUint16(lho + 26, true) + v.getUint16(lho + 28, true);
      const data = new Uint8Array(buf, start, v.getUint32(p + 20, true));
      if (v.getUint16(p + 10, true) === 0) return utf8(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error('texto não encontrado no arquivo');
}

async function readDocx(buf) {
  const doc = new DOMParser().parseFromString(await zipEntry(buf, 'word/document.xml'), 'application/xml');
  return Array.from(doc.getElementsByTagName('w:p')).map(p => {
    let s = '';
    p.querySelectorAll('t,tab,br').forEach(n => { s += n.localName === 't' ? n.textContent : n.localName === 'tab' ? ' ' : '\n'; });
    return s;
  }).join('\n');
}

async function readPdf(buf) {
  if (!window.pdfjsLib) {
    await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = ok; s.onerror = () => no(new Error('sem internet para carregar o leitor de PDF'));
      document.head.append(s);
    });
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const c = await (await pdf.getPage(i)).getTextContent();
    out += c.items.map(t => t.str + (t.hasEOL ? '\n' : ' ')).join('') + '\n';
  }
  return out;
}

async function importFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  try {
    let text;
    if (ext === 'txt') text = await f.text();
    else if (ext === 'docx') text = await readDocx(await f.arrayBuffer());
    else if (ext === 'pdf') text = await readPdf(await f.arrayBuffer());
    else throw new Error('use TXT, DOCX ou PDF');
    text = text.replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    if (!text) throw new Error('nenhum texto encontrado (PDF escaneado só tem imagem)');
    const s = { id: Date.now(), title: f.name.replace(/\.[^.]+$/, ''), text, at: Date.now() };
    scripts.push(s); persist(); editScript(s.id);
  } catch (e) { alert('Não consegui importar: ' + e.message); }
}
$('imp').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; $('file').value = ''; if (f) importFile(f); };

$('toList').onclick = () => { saveCur(); showList(); };
$('script').oninput = $('title').oninput = () => { saveCur(); refreshSetup(); };
$('del').onclick = () => { if (confirm('Excluir este roteiro?')) { scripts = scripts.filter(s => s !== cur); persist(); showList(); } };

$('fs').value = store('tp.fs') || 36;
$('sp').value = store('tp.sp') || 60;
$('mode').value = store('tp.mode') || 'speed';
$('dur').value = store('tp.dur') || '2:00';
$('wpm').value = store('tp.wpm') || 140;
$('sens').value = store('tp.sens') || 1;

let stream, recorder, chunks = [], file;
let drag = false, barriers = [], lastHeard = 0, fb = false, padTop = 0, dur = 120, wpm = 140, y = 0, speed = 60, running = false, last = 0, words = [], idx = 0, rec = null, wake = null;

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const say = t => $('msg').textContent = t || '';
const setFs = v => { v = Math.max(20, Math.min(80, v)); $('fs').value = v; document.documentElement.style.setProperty('--fs', v + 'px'); store('tp.fs', v); };
const parseDur = s => { const p = String(s).split(':').map(Number); const v = p.length > 1 ? p[0] * 60 + p[1] : p[0]; return v > 0 ? Math.min(v, 7200) : 120; };
const fmtDur = v => Math.floor(v / 60) + ':' + String(Math.round(v % 60)).padStart(2, '0');
function adj(d) {
  const m = $('mode').value;
  if (m === 'time') { dur = Math.max(10, dur - 10 * d); $('dur').value = fmtDur(dur); store('tp.dur', $('dur').value); say('Duração ' + fmtDur(dur)); }
  else if (m === 'wpm') { wpm = Math.max(40, Math.min(400, wpm + 10 * d)); $('wpm').value = wpm; store('tp.wpm', wpm); say(wpm + ' palavras/min'); }
  else setSp(speed + 10 * d);
}
function refreshSetup() {
  const m = $('mode').value;
  $('rowSp').style.display = m === 'speed' ? '' : 'none';
  $('rowDur').style.display = m === 'time' ? '' : 'none';
  $('rowWpm').style.display = m === 'wpm' ? '' : 'none';
  $('rowSens').style.display = m === 'speech' ? '' : 'none';
  const n = wordCount($('script').value), w = +$('wpm').value || 140;
  $('est').textContent = n ? `${n} palavras ≈ ${fmtDur(n / w * 60)} de fala a ${w} palavras/min` : '';
}
const setSp = v => { speed = Math.max(10, Math.min(200, v)); $('sp').value = speed; store('tp.sp', speed); say('Velocidade ' + speed); };

function buildText() {
  const el = $('txt');
  el.textContent = '';
  words = []; barriers = [];
  let em = false;
  $('script').value.split(/(\s+)/).forEach(tok => {
    if (!tok) return;
    if (/^\s+$/.test(tok)) { el.append(tok.includes('\n') ? document.createElement('br') : ' '); return; }
    if (tok === '//') { barriers.push(words.length); return; }
    if (tok.startsWith('*')) em = true;
    const s = document.createElement('span');
    s.textContent = tok.replace(/\*/g, '');
    if (em) s.className = 'em';
    if (tok.length > 1 && tok.endsWith('*')) em = false;
    el.append(s);
    words.push({ el: s, n: norm(tok) });
  });
  y = 0; idx = 0;
  padTop = parseFloat(getComputedStyle(el).paddingTop);
  el.style.transform = 'translateY(0)';
}

const maxY = () => $('txt').scrollHeight - $('ov').clientHeight * 0.6;

// Gestos na área do texto: toque pausa/retoma, arrastar move o texto, pinça muda a letra.
(() => {
  const run = $('run');
  let g = null;
  const dist = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  run.addEventListener('touchstart', e => {
    if (e.target.closest('#bar')) return;
    if (e.touches.length === 2) g = { pinch: true, d: dist(e), fs: +$('fs').value };
    else if (e.touches.length === 1) g = { y: e.touches[0].clientY, t: Date.now(), moved: false };
  }, { passive: true });
  run.addEventListener('touchmove', e => {
    if (!g) return;
    if (g.pinch) { if (e.touches.length === 2) { setFs(Math.round(g.fs * dist(e) / g.d)); say('Letra ' + $('fs').value); } return; }
    const dy = e.touches[0].clientY - g.y;
    if (!g.moved && Math.abs(dy) < 8) return;
    g.moved = drag = true; g.y = e.touches[0].clientY;
    y = Math.max(0, Math.min(y - dy, maxY()));
    $('txt').style.transform = `translateY(${-y}px)`;
  }, { passive: true });
  run.addEventListener('touchend', e => {
    if (!g) return;
    const x = g;
    if (e.touches.length) return;
    g = null;
    if (x.pinch) return;
    if (x.moved) {
      drag = false;
      while (idx > 0 && words[idx].el.offsetTop - padTop > y) setIdx(idx - 1);
      while (idx < words.length - 1 && words[idx].el.offsetTop - padTop < y) setIdx(idx + 1);
      lastHeard = performance.now();
    } else if (Date.now() - x.t < 400) {
      $('pause').onclick(); say(running ? 'Rolando' : 'Pausado');
    }
  });
})();

function frame(t) {
  if (!running) return;
  const dt = Math.min(0.1, (t - last) / 1000);
  last = t;
  const max = maxY();
  const m = $('mode').value;
  if (m === 'speech' && !fb && t - lastHeard > 8000) { fb = true; say('Sem voz reconhecida: rolando por velocidade'); }
  if (drag) {}
  else if (m === 'speed') y += speed * dt;
  else if (m === 'time') y += max / dur * dt;
  else if (m === 'wpm') y += wpm / 60 * max / Math.max(1, words.length) * dt;
  else if (fb) {
    y += speed * dt;
    while (idx < words.length - 1 && words[idx + 1].el.offsetTop - padTop <= y) setIdx(idx + 1);
  } else if (words[idx]) {
    const target = words[idx].el.offsetTop - padTop;
    y += (target - y) * Math.min(1, dt * 4);
  }
  y = Math.max(0, Math.min(y, max));
  $('txt').style.transform = `translateY(${-y}px)`;
  requestAnimationFrame(frame);
}

function startScroll() {
  running = true; last = lastHeard = performance.now();
  requestAnimationFrame(frame);
  $('pause').textContent = '⏸';
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
}
function stopScroll() { running = false; if (wake) { wake.release().catch(() => {}); wake = null; } }

// Alinha o fim do que foi ouvido com o roteiro. Usa só sequências de palavras seguidas, então
// repetir o mesmo trecho dá o mesmo resultado e palavra comum solta não faz o texto pular.
// Sensibilidade: far = palavras seguidas exigidas para saltar mais de 12; near = idem perto;
// one = distância máxima aceita com 1 palavra só (0 desliga); len = tamanho mínimo dessa palavra.
const SENS = [{ far: 4, near: 3, one: 0, len: 4 }, { far: 3, near: 2, one: 3, len: 4 }, { far: 3, near: 2, one: 6, len: 3 }];
function setIdx(i) { words[idx]?.el.classList.remove('on'); idx = i; words[idx].el.classList.add('on'); }

function locate(heard) {
  const S = SENS[+$('sens').value] || SENS[1];
  // "//" é barreira: não deixa a rolagem pular a pausa antes de ouvir as palavras que a precedem
  const wall = barriers.find(b => b > idx) ?? Infinity;
  const tail = heard.slice(-6);
  let best = -1, bestScore = 0;
  for (let j = Math.max(0, idx - 1); j < Math.min(idx + 40, words.length, wall); j++) {
    let score = 0, a = j, b = tail.length - 1;
    while (b >= 0 && a >= 0) {
      if (!words[a].n) { a--; continue; }
      if (words[a].n !== tail[b]) break;
      score++; a--; b--;
    }
    const far = j - idx > 12;
    const ok = score >= S.far || (!far && (score >= S.near || (S.one && score === 1 && tail[tail.length - 1].length >= S.len && j - idx <= S.one)));
    if (ok && score > bestScore) { best = j; bestScore = score; }
  }
  return best;
}

function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  lastHeard = performance.now(); fb = false;
  if (!SR) { fb = true; return say('Este navegador não reconhece fala: rolando por velocidade'); }
  rec = new SR();
  rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    const heard = Array.from(e.results).map(r => r[0].transcript).join(' ').split(/\s+/).map(norm).filter(Boolean);
    lastHeard = performance.now();
    if (fb) { fb = false; say('Fala reconhecida: acompanhando você'); }
    const j = locate(heard);
    if (j >= 0 && j + 1 > idx) setIdx(Math.min(j + 1, words.length - 1));
  };
  rec.onerror = e => say('Reconhecimento: ' + e.error + (e.error === 'not-allowed' ? ' (permita o microfone)' : ''));
  rec.onend = () => { if (running && rec) try { rec.start(); } catch {} };
  try { rec.start(); say('Ouvindo… comece a falar'); } catch (e) { say('Falha ao iniciar reconhecimento'); }
}
function stopSpeech() { const r = rec; rec = null; if (r) try { r.stop(); } catch {} }

const camCfg = { f: 'user', r: '1080', a: '9:16' };
try { Object.assign(camCfg, JSON.parse(store('tp.cam'))); } catch {}
$('ccam').value = camCfg.f; $('cres').value = camCfg.r; $('casp').value = camCfg.a;

async function startStream() {
  stream?.getTracks().forEach(t => t.stop());
  const [aw, ah] = $('casp').value.split(':').map(Number), sh = +$('cres').value, lg = Math.round(sh * 16 / 9);
  const w = aw === ah ? sh : aw > ah ? lg : sh, h = aw === ah ? sh : aw > ah ? sh : lg;
  const f = $('ccam').value;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: f }, width: { ideal: w }, height: { ideal: h }, aspectRatio: { ideal: aw / ah } }, audio: true });
  } catch (e) { alert('Sem acesso à câmera/microfone: ' + e.message); return false; }
  const v = $('cam');
  v.style.transform = f === 'user' ? 'scaleX(-1)' : 'none';
  v.onloadedmetadata = () => { fitCam(); say(`Câmera ${v.videoWidth}×${v.videoHeight}` + (Math.min(v.videoWidth, v.videoHeight) < sh ? ' (menor que o pedido)' : '')); };
  v.srcObject = stream;
  return true;
}

// Mostra a prévia na proporção real entregue pela câmera, para o enquadramento bater com o arquivo gravado.
function fitCam() {
  const v = $('cam'), r = v.videoWidth / v.videoHeight;
  if (!r) return;
  const bw = innerWidth, bh = innerHeight, w = Math.min(bw, bh * r), h = w / r;
  Object.assign(v.style, { width: w + 'px', height: h + 'px', left: (bw - w) / 2 + 'px', top: (bh - h) / 2 + 'px' });
}
addEventListener('resize', fitCam);

async function openCam() {
  saveCur(); store('tp.mode', $('mode').value); store('tp.sens', $('sens').value); store('tp.sp', $('sp').value);
  dur = parseDur($('dur').value); $('dur').value = fmtDur(dur); store('tp.dur', $('dur').value);
  wpm = Math.max(40, Math.min(400, +$('wpm').value || 140)); store('tp.wpm', wpm);
  speed = +$('sp').value; setFs(+$('fs').value);
  store('tp.cam', JSON.stringify({ f: $('ccam').value, r: $('cres').value, a: $('casp').value }));
  if (!await startStream()) return;
  buildText();
  $('setup').style.display = 'none'; $('run').style.display = 'block';
  $('try').style.display = $('rec').style.display = '';
}

function closeCam() {
  stopScroll(); stopSpeech();
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('run').style.display = 'none'; $('setup').style.display = 'flex';
}

function countdown() {
  return new Promise(res => {
    let n = 3; const c = $('count'); c.style.display = 'flex'; c.textContent = n;
    const i = setInterval(() => { n--; if (n) c.textContent = n; else { clearInterval(i); c.style.display = 'none'; res(); } }, 1000);
  });
}

async function begin(record) {
  buildText();
  $('try').style.display = $('rec').style.display = 'none';
  await countdown();
  if (record) {
    const type = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    chunks = [];
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
      file = new File(chunks, `teleprompter-${Date.now()}.${ext}`, { type: recorder.mimeType });
      $('rec').textContent = '💾 Salvar'; $('rec').style.display = ''; $('rec').dataset.state = 'save';
      say('Gravação pronta. Toque em Salvar.');
    };
    recorder.start(1000);
  }
  if ($('mode').value === 'speech') startSpeech();
  startScroll();
  $('rec').style.display = ''; $('rec').textContent = record ? '■ Parar' : '■ Parar ensaio';
  $('rec').dataset.state = record ? 'stop' : 'stopTry';
}

async function save() {
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) return await navigator.share({ files: [file] });
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
}

showList();
$('open').onclick = openCam;
$('back').onclick = closeCam;
$('flip').onclick = async () => {
  if ($('rec').dataset.state === 'stop') return;
  $('ccam').value = $('ccam').value === 'user' ? 'environment' : 'user';
  store('tp.cam', JSON.stringify({ f: $('ccam').value, r: $('cres').value, a: $('casp').value }));
  await startStream();
};
$('try').onclick = () => begin(false);
$('rec').onclick = () => {
  const s = $('rec').dataset.state;
  if (s === 'save') return save();
  if (s === 'stop') { stopScroll(); stopSpeech(); recorder.stop(); return; }
  if (s === 'stopTry') { stopScroll(); stopSpeech(); $('rec').textContent = '● Gravar'; $('rec').dataset.state = ''; $('try').style.display = ''; say(''); return; }
  begin(true);
};
$('pause').onclick = () => { if (running) { stopScroll(); $('pause').textContent = '▶'; } else startScroll(); };
$('fsm').onclick = () => setFs(+$('fs').value - 4);
$('fsp').onclick = () => setFs(+$('fs').value + 4);
$('spm').onclick = () => adj(-1);
$('spp').onclick = () => adj(1);
$('mode').onchange = $('wpm').oninput = refreshSetup;
</script>
