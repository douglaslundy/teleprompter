<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Teleprompter</title>
<style>
:root{--fs:36px;--fg:#ffffff;--bg:#000000;--hl:#ffd23f;--lh:1.35;--mx:20px;--ff:system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#setup{display:flex;flex-direction:column;gap:14px;overflow-y:auto}
#list,#recs{display:flex;flex-direction:column;gap:10px}
/* telas de lista/edicao: coluna centrada (monitor) e respeito a notch/barra do iPhone (retrato e paisagem) */
#setup,#list,#recs{width:100%;max-width:760px;margin-inline:auto;height:100dvh;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#items,#recItems{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{text-align:left;background:#111;border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.item b{font-size:17px}.item video{width:100%;border-radius:8px;background:#000;max-height:50dvh}.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.acts button{flex:1;padding:8px}.item small{color:#999}
#est{color:#999;font-size:14px;text-align:center}
#empty{color:#999;text-align:center;margin-top:30px}
.head{display:flex;gap:8px;flex-wrap:wrap}
#title{flex:1;min-width:0;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600}
#script{flex:1;min-height:140px;width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;font-size:18px;resize:none}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
input[type=range]{flex:1}
input[type=color]{min-width:56px;min-height:40px}
#toList,#recsBack{min-width:44px}
select,button{min-height:44px;font:inherit;color:#fff;background:#222;border:1px solid #444;border-radius:12px;padding:12px 16px}
input,select,textarea{font-size:16px} /* menos de 16px faz o iOS dar zoom ao focar */
dialog{background:#1c1c20;color:#fff;border:1px solid #444;border-radius:16px;padding:20px;width:min(92vw,420px);max-height:90dvh;overflow:auto;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog p{margin:0 0 16px;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere}
dialog input{width:100%;margin-bottom:16px;background:#111;color:#fff;border:1px solid #444;border-radius:12px;padding:12px}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin:0}
dialog .acts button{flex:0 1 auto;min-width:96px}
dialog button.danger{background:#d22;border-color:#d22;font-weight:600}
body.pip{margin:0;background:var(--bg);overflow:hidden}
.pip #ov{position:fixed;inset:0;height:auto;pointer-events:auto;background:var(--bg);cursor:pointer}
.pip #txt{padding-top:35dvh;max-width:none}
.pip #rl{top:35dvh}
button.main{background:#d22;border-color:#d22;font-weight:600;font-size:18px}
#run{touch-action:none;display:none;position:fixed;inset:0;background:#000;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;background:#000}
#ov{position:absolute;left:0;right:0;top:var(--ovt,44dvh);height:42dvh;overflow:hidden;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 14%,transparent)}
#txt{text-shadow:0 0 3px var(--bg),0 0 8px var(--bg),0 0 14px var(--bg)} /* texto na frente da imagem inteira, sem faixa escura */
#rl{position:absolute;left:0;right:0;top:6dvh;height:calc(var(--fs)*var(--lh));background:rgba(255,255,255,.14);border-block:1px solid rgba(255,255,255,.4);display:none}
#txt{position:relative;max-width:1100px;margin-inline:auto;padding:6dvh var(--mx) 60dvh;font-size:var(--fs);line-height:var(--lh);font-weight:600;color:var(--fg);font-family:var(--ff);will-change:transform}
#txt span.on{color:var(--hl)}
#txt span.em{text-decoration:underline;text-underline-offset:.15em;font-weight:800}
#look{font-size:15px}#look summary{padding:6px 0;color:#bbb}#look label{margin:8px 0}#look input[type=color]{width:48px;height:32px;padding:0;border:0;background:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
#bar button{padding:12px 14px;min-width:48px}
#bar button.rec{background:#d22;border-color:#d22;font-weight:600}
#msg{position:absolute;left:12px;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 120px);text-align:center;font-size:14px;color:#ffd23f;text-shadow:0 0 4px #000}
#vbp{position:absolute;left:0;right:0;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 70px);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:rgba(0,0,0,.75);z-index:5}
#vbp[hidden]{display:none}#vbp button{flex:none;white-space:nowrap}#vbp button.on{background:#d22;border-color:#d22}
#clk{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 4px);font-size:14px;font-variant-numeric:tabular-nums;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 8px;pointer-events:none;display:none}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;font-weight:700;text-shadow:0 0 20px #000}
</style>
</head>
<body>
<div id="list">
  <div class="head"><button class="main" id="new" style="flex:1" data-i18n="newScript">+ Novo roteiro</button></div>
  <div class="head"><button id="imp" data-i18n="import">Importar</button><button id="tplBtn" data-i18n="templates">Modelos</button><button id="recsBtn" data-i18n="recsTitle">Gravações</button><button id="syncBtn" data-i18n="sync">Sincronizar</button><select id="uil"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select></div>
  <input type="file" id="file" accept=".txt,.docx,.pdf,text/plain" hidden>
  <div id="items"></div>
</div>

<div id="recs" style="display:none">
  <div class="head"><button id="recsBack">‹</button><b data-i18n="recsTitle" style="align-self:center;font-size:18px">Gravações</b></div>
  <div id="recItems"></div>
</div>

<div id="setup" style="display:none">
  <div class="head">
    <button id="toList">‹</button>
    <input id="title" placeholder="Título do roteiro" data-i18n-ph="titlePh">
    <button id="ai" data-i18n="aiBtn">✨ IA</button>
    <button id="del">🗑</button>
  </div>
  <textarea id="script" placeholder="Cole ou escreva o roteiro aqui" data-i18n-ph="scriptPh"></textarea>
  <label><span data-i18n="mode">Modo</span>
    <select id="mode"><option value="speed" data-i18n="mSpeed">Velocidade</option><option value="time" data-i18n="mTime">Tempo fixo</option><option value="wpm" data-i18n="mWpm">Palavras por minuto</option><option value="speech" data-i18n="mSpeech">Acompanhar minha fala</option></select>
  </label>
  <label><span data-i18n="font">Letra</span> <input id="fs" type="range" min="20" max="80" value="36"></label>
  <label id="rowSp"><span data-i18n="speed">Velocidade</span> <input id="sp" type="range" min="10" max="200" value="60"></label>
  <label id="rowDur"><span data-i18n="durLabel">Duração (mm:ss)</span> <input id="dur" value="2:00" inputmode="numeric" size="6"></label>
  <label id="rowWpm"><span data-i18n="wpmLabel">Palavras/min</span> <input id="wpm" type="number" min="40" max="400" value="140"></label>
  <label id="rowSens"><span data-i18n="sens">Sensibilidade da fala</span> <select id="sens"><option value="0" data-i18n="sRigid">Rígida</option><option value="1" data-i18n="sNormal">Normal</option><option value="2" data-i18n="sLoose">Solta</option></select></label>
  <label id="rowSl"><span data-i18n="slang">Idioma da fala</span> <select id="slang"><option value="pt-BR">Português</option><option value="en-US">English</option><option value="es-ES">Español</option></select></label>
  <div id="est"></div>
  <details id="camset"><summary data-i18n="camera">Câmera</summary>
    <label><span data-i18n="camera">Câmera</span> <select id="ccam"><option value="user" data-i18n="front">Frontal</option><option value="environment" data-i18n="rear">Traseira</option></select></label>
    <label><span data-i18n="res">Resolução</span> <select id="cres"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select></label>
    <label><span data-i18n="aspect">Proporção</span> <select id="casp"><option value="9:16" data-i18n="a916">9:16 vertical</option><option value="16:9" data-i18n="a169">16:9 horizontal</option><option value="1:1" data-i18n="a11">1:1 quadrado</option></select></label>
    <label><span data-i18n="mic">Microfone</span> <select id="cmic"></select></label>
    <label><span data-i18n="noise">Reduzir ruído</span> <input type="checkbox" id="cnoise" checked></label>
    <label><span data-i18n="echo">Cancelar eco</span> <input type="checkbox" id="cecho" checked></label>
    <label><span data-i18n="vb">Fundo do vídeo</span> <select id="cvbg"><option value="none" data-i18n="vbNone">Nenhum</option><option value="blur" data-i18n="vbBlur">Desfocar</option><option value="color" data-i18n="vbColor">Cor sólida</option><option value="img" data-i18n="vbImg">Minha foto</option>
      <option value="s:library" data-i18n="vbLib">Biblioteca</option><option value="s:office" data-i18n="vbOff">Escritório</option><option value="s:mansion" data-i18n="vbMan">Mansão de luxo</option><option value="s:beach" data-i18n="vbBeach">Casa na praia (janela e estante)</option><option value="s:home" data-i18n="vbHome">Home office com estante</option><option value="s:loft" data-i18n="vbLoft">Loft industrial</option><option value="s:grad" data-i18n="vbGrad">Degradê</option></select></label>
    <label id="cvcL" hidden><span data-i18n="vbColor">Cor sólida</span> <input type="color" id="cvc" value="#1e3a5f"></label>
    <label id="cvfL" hidden><span data-i18n="vbUp">Escolher foto</span> <input type="file" id="cvf" accept="image/*"></label>
  </details>
  <details id="look"><summary data-i18n="look">Aparência</summary>
    <label><span data-i18n="theme">Tema</span> <select id="theme"><option value="0" data-i18n="th0">Branco no escuro</option><option value="1" data-i18n="th1">Amarelo no escuro</option><option value="2" data-i18n="th2">Preto no branco</option><option value="3" data-i18n="th3">Verde no escuro</option><option value="x" data-i18n="thX">Personalizado</option></select></label>
    <label><span data-i18n="text">Texto</span> <input type="color" id="cfg" value="#ffffff"></label>
    <label><span data-i18n="bg">Fundo</span> <input type="color" id="cbg" value="#000000"></label>
    <label><span data-i18n="hl">Destaque</span> <input type="color" id="chl" value="#ffd23f"></label>
    <label><span data-i18n="lh">Entrelinha</span> <input id="clh" type="range" min="1.1" max="2.2" step="0.05" value="1.35"></label>
    <label><span data-i18n="margins">Margens</span> <input id="cmx" type="range" min="0" max="60" value="20"></label>
    <label><span data-i18n="mh">Espelhar horizontal</span> <input type="checkbox" id="cmh"></label>
    <label><span data-i18n="mv">Espelhar vertical</span> <input type="checkbox" id="cmv"></label>
    <label><span data-i18n="pos">Posição do texto</span> <select id="cpos"><option value="mid" data-i18n="posMid">Meio da tela</option><option value="top" data-i18n="posTop">Topo (perto da câmera)</option></select></label>
    <label><span data-i18n="paged">Rolagem por página</span> <input type="checkbox" id="cpage"></label>
    <label><span data-i18n="clock">Contador de tempo</span> <input type="checkbox" id="cclk"></label>
    <label><span data-i18n="rl">Linha de leitura</span> <input type="checkbox" id="crl"></label>
    <label><span data-i18n="dys">Fonte para dislexia</span> <input type="checkbox" id="cdys"></label>
  </details>
  <button class="main" id="open" data-i18n="openCam">Abrir câmera</button>
</div>

<div id="run">
  <video id="cam" playsinline muted autoplay></video>
  <div id="ov"><div id="rl"></div><div id="txt"></div></div>
  <div id="clk"></div>
  <div id="count"></div>
  <div id="msg"></div>
  <div id="vbp" hidden></div>
  <div id="bar">
    <button id="back">✕</button>
    <button id="flip">⟲</button>
    <button id="rcBtn" title="Controle remoto">📱</button>
    <button id="pipBtn" title="Janela flutuante" hidden>🪟</button>
    <button id="vbBtn" title="Fundo">🖼</button>
    <button id="fsm">A−</button><button id="fsp">A+</button>
    <button id="spm">−</button><button id="spp">+</button>
    <button id="pause">⏸</button>
    <button id="try" data-i18n="try">Ensaiar</button>
    <button id="cont" data-i18n="take" style="display:none">Novo trecho</button>
    <button id="rec" class="rec" data-i18n="rec">● Gravar</button>
  </div>
</div>

// Janelas proprias (modal) no lugar de alert/confirm/prompt do navegador. Cada uma devolve uma Promise.
function uiDialog(msg, { input, def = '', ok = tr('ok'), cancel = true, danger = false } = {}) {
  return new Promise(res => {
    const d = document.createElement('dialog'), p = document.createElement('p'), acts = document.createElement('div');
    p.textContent = msg; acts.className = 'acts'; d.append(p);
    let inp = null;
    if (input) { inp = document.createElement('input'); inp.type = input; inp.value = def; inp.autocomplete = 'off'; d.append(inp); }
    const done = v => { d.close(); d.remove(); res(v); };
    if (cancel) { const c = document.createElement('button'); c.textContent = tr('cancel'); c.onclick = () => done(inp ? null : false); acts.append(c); }
    const o = document.createElement('button'); o.textContent = ok; if (danger) o.className = 'danger'; else o.className = 'main';
    o.onclick = () => done(inp ? inp.value : true); acts.append(o); d.append(acts);
    d.addEventListener('cancel', e => { e.preventDefault(); done(inp ? null : false); }); // Esc
    if (inp) inp.onkeydown = e => { if (e.key === 'Enter') o.click(); };
    document.body.append(d); d.showModal(); (inp || o).focus();
  });
}
const uiAlert = msg => uiDialog(msg, { cancel: false });

}

const utf8 = b => new TextDecoder().decode(b);

async function zipEntry(buf, name) {
  const v = new DataView(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error(tr('zipBad'));
  let p = v.getUint32(e + 16, true);
  for (let i = v.getUint16(e + 10, true); i > 0; i--) {
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true);
    if (utf8(new Uint8Array(buf, p + 46, nl)) === name) {
      const lho = v.getUint32(p + 42, true), start = lho + 30 + v.getUint16(lho + 26, true) + v.getUint16(lho + 28, true);
      const data = new Uint8Array(buf, start, v.getUint32(p + 20, true));
      if (v.getUint16(p + 10, true) === 0) return utf8(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error(tr('zipNone'));
}

async function readDocx(buf) {
  const doc = new DOMParser().parseFromString(await zipEntry(buf, 'word/document.xml'), 'application/xml');
  return Array.from(doc.getElementsByTagName('w:p')).map(p => {
    let s = '';
    p.querySelectorAll('t,tab,br').forEach(n => { s += n.localName === 't' ? n.textContent : n.localName === 'tab' ? ' ' : '\n'; });
    return s;
  }).join('\n');
}

// Legenda SRT a partir do roteiro: cada palavra recebe o instante em que a leitura chegou nela (fala: palavra ouvida;
// demais modos: palavra na linha de leitura, aproximado). Palavras puladas sao interpoladas.
const srtTime = ms => { const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':') + ',' + String(Math.round(ms % 1000)).padStart(3, '0'); };
function srtFrom(texts, times, total) {
  let last = -1; for (let i = 0; i < texts.length; i++) if (times[i] !== undefined) last = i;
  if (last < 0) return '';
  const T = []; let prev = 0;
  for (let i = 0; i <= last; i++) {
    if (times[i] !== undefined) { T[i] = times[i]; prev = i; continue; }
    let nx = i; while (times[nx] === undefined) nx++;
    T[i] = times[prev] + (times[nx] - times[prev]) * (i - prev) / (nx - prev);
  }
  // palavras que chegaram juntas (mesma linha, ou salto da fala) dividem o intervalo ate a proxima chegada
  for (let i = 0; i <= last;) {
    let j = i; while (j + 1 <= last && T[j + 1] === T[i]) j++;
    const nxt = j + 1 <= last ? T[j + 1] : Math.min(T[i] + (j - i + 1) * 350, Math.max(total, T[i] + 350));
    for (let k = i; k <= j; k++) T[k] = T[i] + (nxt - T[i]) * (k - i) / (j - i + 1);
    i = j + 1;
  }
  const cues = []; let c = null;
  for (let i = 0; i <= last; i++) {
    if (!c) c = { a: i, w: [] };
    c.w.push(texts[i]);
    if (c.w.length >= 8 || c.w.join(' ').length >= 40 || /[.!?…]$/.test(texts[i])) { c.b = i; cues.push(c); c = null; }
  }
  if (c) { c.b = last; cues.push(c); }
  return cues.map((q, n) => {
    const a = T[q.a], nextA = cues[n + 1] ? T[cues[n + 1].a] : a + 4000;
    const b = Math.max(a + 200, Math.min(nextA, a + 5000, cues[n + 1] ? Infinity : Math.max(total, a + 600))); // termina quando a proxima comeca: sem sobreposicao
    return `${n + 1}\n${srtTime(a)} --> ${srtTime(b)}\n${q.w.join(' ')}\n`;
  }).join('\n');
}

}

function frame(t) {

// Alinha o fim do que foi ouvido com o roteiro. Usa só sequências de palavras seguidas, então
// repetir o mesmo trecho dá o mesmo resultado e palavra comum solta não faz o texto pular.
// Sensibilidade: far = palavras seguidas exigidas para saltar mais de 12; near = idem perto;
// one = distância máxima aceita com 1 palavra só (0 desliga); len = tamanho mínimo dessa palavra.
const SENS = [{ far: 4, near: 3, one: 0, len: 4 }, { far: 3, near: 2, one: 3, len: 4 }, { far: 3, near: 2, one: 6, len: 3 }];
function setIdx(i) { words[idx]?.el.classList.remove('on'); idx = i; words[idx].el.classList.add('on'); }

function locate(heard) {
  const S = SENS[+$('sens').value] || SENS[1];
  // "//" é barreira: não deixa a rolagem pular a pausa antes de ouvir as palavras que a precedem
  const wall = barriers.find(b => b > idx) ?? Infinity;
  const tail = heard.slice(-6);
  let best = -1, bestScore = 0;
  for (let j = Math.max(0, idx - 1); j < Math.min(idx + 40, words.length, wall); j++) {
    let score = 0, a = j, b = tail.length - 1;
    while (b >= 0 && a >= 0) {
      if (!words[a].n) { a--; continue; }
      if (words[a].n !== tail[b]) break;
      score++; a--; b--;
    }
    const far = j - idx > 12;
    const ok = score >= S.far || (!far && (score >= S.near || (S.one && score === 1 && tail[tail.length - 1].length >= S.len && j - idx <= S.one)));
    if (ok && score > bestScore) { best = j; bestScore = score; }
  }
  return best;
}

function startSpeech() {

function vbScene(name, W, H) {
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const r = (x, y, w, h, f, o = '') => `<rect x="${x * W}" y="${y * H}" width="${w * W}" height="${h * H}" fill="${f}" ${o}/>`;
  const books = (x, y, w, h, n) => { let o = '', bx = x; const pal = ['#8b2e2e', '#2e4a8b', '#2e6b4a', '#c9a227', '#5a3a1e', '#6b2e6b', '#d8cdb4', '#3a3a3a']; for (let i = 0; i < n && bx < x + w - 0.01; i++) { const bw = (0.006 + rnd() * 0.01) * (W > H ? 1 : 2), bh = h * (0.7 + rnd() * 0.3); o += r(bx, y + h - bh, bw, bh, pal[(rnd() * 8) | 0]); bx += bw + 0.001; } return o; };
  const shelf = (x, y, w, h, rows) => { let o = r(x, y, w, h, '#4a2f1a'); for (let i = 0; i < rows; i++) { const ry = y + (h / rows) * i + 0.01; o += r(x + 0.01, ry, w - 0.02, h / rows - 0.015, '#2b1a0e') + books(x + 0.015, ry, w - 0.03, h / rows - 0.02, 60); } return o; };
  const lin = (id, a, b) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const defs = lin('g1', '#a9d4f5', '#e8f4fc') + lin('g2', '#3b2a4f', '#1e3a5f') + lin('g3', '#f0e4c8', '#c9b68a') + `<filter id="b"><feGaussianBlur stdDeviation="${W / 220}"/></filter>`;
  const sc = {
    library: () => r(0, 0, 1, 1, '#2a1a10') + shelf(0.02, 0.05, 0.3, 0.9, 6) + shelf(0.35, 0.05, 0.3, 0.9, 6) + shelf(0.68, 0.05, 0.3, 0.9, 6) + `<ellipse cx="${W / 2}" cy="${H * 0.2}" rx="${W * 0.4}" ry="${H * 0.25}" fill="#ffcf7a" opacity=".18"/>`,
    office: () => r(0, 0, 1, 1, '#e4e6ea') + r(0.52, 0.1, 0.42, 0.55, '#6f7782') + r(0.54, 0.12, 0.38, 0.51, 'url(#g1)') + [0, 1, 2, 3, 4].map(i => r(0.55 + i * 0.075, 0.4 - rnd() * 0.15, 0.06, 0.23, '#7f94aa')).join('') + r(0, 0.82, 1, 0.18, '#8a6a4a') + r(0.06, 0.15, 0.18, 0.22, '#fff', 'stroke="#aaa" stroke-width="3"') + r(0.09, 0.19, 0.12, 0.14, '#9bb7d4') + `<ellipse cx="${W * 0.1}" cy="${H * 0.75}" rx="${W * 0.05}" ry="${H * 0.12}" fill="#3f7d4e"/>`,
    mansion: () => r(0, 0, 1, 1, 'url(#g3)') + [0.12, 0.42, 0.72].map(x => r(x, 0.08, 0.16, 0.6, '#9fc3e0') + `<path d="M${x * W} ${0.08 * H} a${0.08 * W} ${0.08 * W} 0 0 1 ${0.16 * W} 0" fill="#9fc3e0"/>` + r(x - 0.02, 0.05, 0.03, 0.72, '#b8963e') + r(x + 0.15, 0.05, 0.03, 0.72, '#b8963e')).join('') + [0.3, 0.5, 0.7].map(x => `<circle cx="${x * W}" cy="${0.06 * H}" r="${W * 0.014}" fill="#ffd77a"/>`).join('') + [...Array(12)].map((_, i) => [...Array(4)].map((_, j) => r(i / 12, 0.78 + j * 0.055, 1 / 12, 0.055, (i + j) % 2 ? '#f4f1ea' : '#2c2c2c')).join('')).join(''),
    beach: () => r(0, 0, 1, 1, '#ece4d6') + r(0.04, 0.1, 0.44, 0.64, '#fff') + r(0.06, 0.12, 0.4, 0.6, 'url(#g1)') + r(0.06, 0.4, 0.4, 0.14, '#2f86b8') + r(0.06, 0.54, 0.4, 0.18, '#e6d3a1') + `<circle cx="${W * 0.36}" cy="${H * 0.24}" r="${W * 0.03}" fill="#ffe08a"/>` + r(0.26, 0.12, 0.012, 0.6, '#fff') + r(0.06, 0.42, 0.4, 0.012, '#fff') + shelf(0.56, 0.08, 0.38, 0.74, 5) + r(0, 0.84, 1, 0.16, '#9b7650'),
    home: () => r(0, 0, 1, 1, '#41594a') + shelf(0.1, 0.1, 0.5, 0.6, 4) + r(0.7, 0.12, 0.2, 0.28, '#e9e2d0') + r(0.72, 0.14, 0.16, 0.24, '#7da0c0') + `<ellipse cx="${W * 0.78}" cy="${H * 0.78}" rx="${W * 0.07}" ry="${H * 0.14}" fill="#2f7a3e"/>` + r(0, 0.88, 1, 0.12, '#7a5a3a'),
    loft: () => r(0, 0, 1, 1, '#8a4a3a') + [...Array(14)].map((_, i) => [...Array(10)].map((_, j) => r(j / 10 + (i % 2) * 0.05 - 0.05, i / 14, 0.098, 0.068, '#a85a46')).join('')).join('') + r(0.3, 0.1, 0.4, 0.6, '#222') + [0, 1, 2].map(i => [0, 1, 2].map(j => r(0.31 + i * 0.13, 0.11 + j * 0.195, 0.12, 0.185, '#b7d3e8')).join('')).join('') + `<path d="M${W * 0.15} 0 V${H * 0.2}" stroke="#222" stroke-width="3"/><path d="M${W * 0.1} ${H * 0.2} h${W * 0.1} l-${W * 0.02} ${H * 0.06} h-${W * 0.06}z" fill="#222"/>`,
    grad: () => r(0, 0, 1, 1, 'url(#g2)') + `<circle cx="${W * 0.8}" cy="${H * 0.2}" r="${W * 0.25}" fill="#7a5ac0" opacity=".25"/>`,
  };
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><defs>${defs}</defs><g filter="url(#b)">${sc[name]()}</g></svg>`;
}

async function vbBg(W, H) {
  const c = Object.assign(document.createElement('canvas'), { width: W, height: H }), x = c.getContext('2d');
  const m = vbCfg.m;
  if (m === 'none' || m === 'blur') return null;
  if (m === 'color') { x.fillStyle = vbCfg.c; x.fillRect(0, 0, W, H); return c; }
  const img = new Image();
  if (m.startsWith('s:')) img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(vbScene(m.slice(2), W, H));
  else img.src = store('tp.vbgimg') || '';
  try { await img.decode(); } catch { x.fillStyle = '#222'; x.fillRect(0, 0, W, H); return c; }
  const k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
  x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  return c;
}

function vbStop() {
  VB.on = false; VB.cur = null; clearTimeout(VB.t); $('vbp').hidden = true; VB.cv?.remove(); VB.cv = VB.out = null;
  const v = $('cam'); if (v) v.style.visibility = '';
}

// Roda quando ha fundo escolhido OU quando a camera entregou proporcao diferente da pedida (celular que gira a imagem):
// o canvas sempre sai na proporcao escolhida, cortando o centro do quadro da camera.
function vbStart() {
  vbStop();
  const v = $('cam'), [aw, ah] = $('casp').value.split(':').map(Number);
  if (vbCfg.m === 'none' && Math.abs(v.videoWidth / v.videoHeight - aw / ah) < 0.05) return Promise.resolve();
  return VB.starting = (async () => {
    if (vbCfg.m !== 'none') {
      say(tr('vbLoad'));
      try { VB.cur = await vbSeg(); } catch (e) { say(''); uiAlert(tr('vbFail') + ' (' + (e?.message || e) + ')'); return; }
      say('');
    }
    const S = Math.min(720, +$('cres').value || 720), W = aw >= ah ? Math.round(S * aw / ah) : S, H = aw >= ah ? S : Math.round(S * ah / aw);
    const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
    const cv = mk(W, H), pc = mk(W, H), mc = mk(1, 1), sm = mk(Math.ceil(W / 24), Math.ceil(H / 24));
    const cx = cv.getContext('2d'), px = pc.getContext('2d'), mx = mc.getContext('2d'), sx = sm.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    let mi = null; VB.W = W; VB.H = H; VB.mode = vbCfg.m; VB.bg = await vbBg(W, H);
    if (!$('cam').srcObject) return; // fechou a camera enquanto carregava
    cv.id = 'vc'; v.after(cv); v.style.visibility = 'hidden'; VB.cv = cv; VB.on = true; fitCam();
    VB.out = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...(stream?.getAudioTracks() || [])]);
    const onMask = r => {
      const m = r.confidenceMasks[0], a = m.getAsFloat32Array();
      if (mc.width !== m.width || mc.height !== m.height) { mc.width = m.width; mc.height = m.height; mi = mx.createImageData(m.width, m.height); }
      const d = mi.data;
      for (let i = 0, j = 3; i < a.length; i++, j += 4) { const t = Math.min(1, Math.max(0, (a[i] - 0.3) / 0.4)); d[j] = t * t * (3 - 2 * t) * 255; }
      mx.putImageData(mi, 0, 0);
    };
    const step = () => {
      if (!VB.on) return;
      try {
        const sw = v.videoWidth, sh = v.videoHeight;
        if (v.readyState >= 2 && sw && sh) {
          const q = W / H, cw = sw / sh > q ? sh * q : sw, ch = sw / sh > q ? sh : sw / q, x0 = (sw - cw) / 2, y0 = (sh - ch) / 2; // recorte central na proporcao do canvas
          if (VB.mode === 'none' || !VB.cur) cx.drawImage(v, x0, y0, cw, ch, 0, 0, W, H);
          else {
            try { VB.cur.segmentForVideo(v, performance.now(), onMask); } catch (e) { VB.err = e; }
            const fx = mc.width / sw, fy = mc.height / sh;
            px.globalCompositeOperation = 'copy'; px.drawImage(mc, x0 * fx, y0 * fy, cw * fx, ch * fy, 0, 0, W, H);
            px.globalCompositeOperation = 'source-in'; px.drawImage(v, x0, y0, cw, ch, 0, 0, W, H);
            if (VB.bg) cx.drawImage(VB.bg, 0, 0); else { sx.drawImage(v, x0, y0, cw, ch, 0, 0, sm.width, sm.height); cx.drawImage(sm, 0, 0, W, H); }
            cx.drawImage(pc, 0, 0);
          }
        }
      } catch (e) { VB.err = e; } finally {
        if (VB.on) VB.t = setTimeout(step, 33); // setTimeout (nao rAF): segue rodando com a aba em segundo plano, ex.: com a janela flutuante sobre o Zoom
      }
    };
    step();
  })().finally(() => { VB.starting = null; });
}

// Troca o fundo sem reiniciar a camera (vale tambem durante a gravacao: o canvas gravado so muda de fundo).
async function vbSet(m) {
  vbCfg.m = m; saveVb();
  if (m === 'img' && !store('tp.vbgimg')) { $('cvf').click(); return; }
  if (!VB.on) { if (m !== 'none') await vbStart(); return; } // fora da gravacao: liga o pipeline na hora
  if (m !== 'none' && !VB.cur) { say(tr('vbLoad')); try { VB.cur = await vbSeg(); } catch (e) { say(''); uiAlert(tr('vbFail') + ' (' + (e?.message || e) + ')'); return; } say(''); }
  VB.mode = m; VB.bg = await vbBg(VB.W, VB.H);
}
$('cvbg').value = vbCfg.m; $('cvc').value = vbCfg.c;
const vbUi = () => { $('cvcL').hidden = vbCfg.m !== 'color'; $('cvfL').hidden = vbCfg.m !== 'img'; };
vbUi();
$('cvbg').onchange = () => { vbCfg.m = $('cvbg').value; saveVb(); vbUi(); if (vbCfg.m === 'img' && !store('tp.vbgimg')) $('cvf').click(); if (vbCfg.m !== 'none') vbSeg().catch(() => {}); }; // ja baixa o modelo ao escolher
$('cvc').oninput = () => { vbCfg.c = $('cvc').value; saveVb(); };
$('vbBtn').onclick = () => {
  const p = $('vbp');
  if (!p.hidden) { p.hidden = true; return; }
  if ($('rec').dataset.state === 'stop' && !VB.on) { say(tr('vbNoRec')); return; }
  p.textContent = '';
  [...$('cvbg').options].forEach(o => {
    const b = document.createElement('button'); b.textContent = o.textContent; b.classList.toggle('on', o.value === vbCfg.m);
    b.onclick = async () => {
      $('cvbg').value = o.value; vbUi(); p.hidden = true;
      await vbSet(o.value);
    };
    p.append(b);
  });
  p.hidden = false;
};
$('cvf').onchange = async () => {
  const f = $('cvf').files[0]; if (!f) return;
  const bm = await createImageBitmap(f), k = Math.min(1, 1280 / Math.max(bm.width, bm.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bm.width * k), height: Math.round(bm.height * k) });
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
  store('tp.vbgimg', c.toDataURL('image/jpeg', 0.82));
  if (vbCfg.m === 'img' && $('run').style.display === 'block') vbSet('img');
};

async function openCam() {
  saveCur(); store('tp.mode', $('mode').value); store('tp.sens', $('sens').value); store('tp.slang', $('slang').value); store('tp.sp', $('sp').value);
  dur = parseDur($('dur').value); $('dur').value = fmtDur(dur); store('tp.dur', $('dur').value);
  wpm = Math.max(40, Math.min(400, +$('wpm').value || 140)); store('tp.wpm', wpm);
  speed = +$('sp').value; setFs(+$('fs').value);
  saveCam();
  if (!await startStream()) return;
  buildText();
  $('setup').style.display = 'none'; $('run').style.display = 'block';
  $('try').style.display = $('rec').style.display = '';
}

function closeCam() {
  pipWin?.close(); rcStop(); stopScroll(); stopSpeech();
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  vbStop();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('run').style.display = 'none'; $('setup').style.display = 'flex'; $('cont').style.display = 'none';
}

function countdown() {
  return new Promise(res => {
    let n = 3; const c = $('count'); c.style.display = 'flex'; c.textContent = n;
    const i = setInterval(() => { n--; if (n) c.textContent = n; else { clearInterval(i); c.style.display = 'none'; res(); } }, 1000);
  });
}

async function begin(record, keep) {
  if (!keep) buildText();
  let q = null; // cota do plano: so vale com conta; sem conta ou sem rede, grava normalmente
  if (record && store('tp.token')) {
    try { q = await api('/quota', null); } catch {}
    if (q && !q.can_record) { uiAlert(tr('quotaOut')); $('try').style.display = $('rec').style.display = ''; return; }
  }
  if (record) take = keep ? take + 1 : 1;
  $('try').style.display = $('rec').style.display = $('cont').style.display = 'none';
  await countdown();
  if (record) {
    await VB.starting; // espera o fundo virtual ficar pronto para nao gravar a camera crua
    const type = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    chunks = [];
    recorder = new MediaRecorder(VB.out || stream, type ? { mimeType: type } : undefined);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    const t0 = Date.now(), maxS = q?.plan.max_video_seconds || 0;
    const cap = maxS && setTimeout(() => { if (recorder.state !== 'inactive') { uiAlert(tr('quotaCut')); recorder.stop(); stopScroll(); stopSpeech(); } }, maxS * 1000);
    capT = []; capT0 = t0; yi = 0; // novo trecho comeca onde a leitura esta, nao na palavra 0
    while (yi < words.length - 1 && words[yi + 1].el.offsetTop - padTop <= y) yi++;
    capFrom = $('mode').value === 'speech' ? idx : words.findIndex(w => w.el.offsetTop === words[yi].el.offsetTop); // inclui a linha inteira
    recorder.onstop = () => {
      clearTimeout(cap);
      const srt = srtFrom(words.map(w => w.el.textContent).slice(capFrom), capT.slice(capFrom), Date.now() - t0); capT0 = 0;
      if (store('tp.token')) api('/usage/video', { seconds: Math.max(1, Math.round((Date.now() - t0) / 1000)) }).catch(() => {});
      const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
      file = new File(chunks, `teleprompter-${Date.now()}${take > 1 ? '-t' + take : ''}.${ext}`, { type: recorder.mimeType });
      dbDo('readwrite', st => st.put({ id: Date.now(), name: file.name, title: (cur?.title || '') + (take > 1 ? ' · ' + tr('takeN', take) : ''), at: Date.now(), size: file.size, type: file.type, blob: file, srt }));
      $('rec').textContent = tr('save'); $('rec').style.display = $('cont').style.display = ''; $('rec').dataset.state = 'save';
      say(tr('recReady'));
    };
    recorder.start(1000);
  }
  if ($('mode').value === 'speech') startSpeech();
  startScroll();
  $('rec').style.display = ''; $('rec').textContent = tr(record ? 'stopRec' : 'stopTry');
  $('rec').dataset.state = record ? 'stop' : 'stopTry';
}

// Gravações ficam no IndexedDB do aparelho (o navegador pode limpá-las se faltar espaço).
const db = new Promise(ok => {
  try {
    const q = indexedDB.open('tp', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('rec', { keyPath: 'id' });
    q.onsuccess = () => ok(q.result); q.onerror = () => ok(null);
  } catch { ok(null); }
});
const dbDo = async (mode, fn) => {
  const d = await db; if (!d) return [];
  return new Promise(ok => { const q = fn(d.transaction('rec', mode).objectStore('rec')); q.onsuccess = () => ok(q.result); q.onerror = () => ok([]); });
};
navigator.storage?.persist?.().catch(() => {});

async function showRecs() {
  $('list').style.display = 'none'; $('recs').style.display = 'flex';
  const box = $('recItems'); box.textContent = '';
  const all = ((await dbDo('readonly', st => st.getAll())) || []).sort((a, b) => b.at - a.at);
  if (!all.length) { const e = document.createElement('div'); e.id = 'empty'; e.textContent = tr('noRecs'); box.append(e); return; }
  all.forEach(r => {
    const it = document.createElement('div'); it.className = 'item';
    const ti = document.createElement('b'); ti.textContent = r.title || r.name;
    const m = document.createElement('small'); m.textContent = `${new Date(r.at).toLocaleString(LOCALE[lang])} · ${r.size < 1048576 ? Math.round(r.size / 1024) + " KB" : (r.size / 1048576).toFixed(1) + " MB"}`;
    const acts = document.createElement('div'); acts.className = 'acts';
    const bp = document.createElement('button'); bp.textContent = tr('play');
    bp.onclick = () => {
      if (it.querySelector('video')) return;
      const v = document.createElement('video'); v.controls = v.playsInline = true; v.src = URL.createObjectURL(r.blob);
      it.insertBefore(v, acts); v.play().catch(() => {});
    };
    const bs = document.createElement('button'); bs.textContent = tr('share');
    bs.onclick = () => save(new File([r.blob], r.name, { type: r.type }));
    const bd = document.createElement('button'); bd.textContent = tr('del');
    bd.onclick = async () => { if (await uiConfirm(tr('delRec'), true)) { await dbDo('readwrite', st => st.delete(r.id)); showRecs(); } };
    const bt = document.createElement('button'); bt.textContent = 'SRT'; bt.hidden = !r.srt;
    bt.onclick = () => save(new File([r.srt], r.name.replace(/\.[^.]+$/, '') + '.srt', { type: 'application/x-subrip' }));
    acts.append(bp, bs, bt, bd); it.append(ti, m, acts); box.append(it);
  });
}

async function save(f = file) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) return await navigator.share({ files: [f] });
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
}

applyLang();
showList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
$('uil').onchange = () => { lang = $('uil').value; store('tp.lang', lang); store('tp.slang', ''); applyLang(); showList(); };
$('recsBtn').onclick = showRecs;
$('tplBtn').onclick = () => tplOpen ? showList() : showTemplates();
$('recsBack').onclick = showList;
$('open').onclick = openCam;
$('back').onclick = closeCam;
$('flip').onclick = async () => {
  if ($('rec').dataset.state === 'stop') return;
  $('ccam').value = $('ccam').value === 'user' ? 'environment' : 'user';
  saveCam();
  await startStream();
};
$('try').onclick = () => begin(false);
$('cont').onclick = () => begin(true, true);
$('rec').onclick = () => {
  const s = $('rec').dataset.state;
  if (s === 'save') return save();
  if (s === 'stop') { stopScroll(); stopSpeech(); recorder.stop(); return; }
  if (s === 'stopTry') { stopScroll(); stopSpeech(); $('rec').textContent = tr('rec'); $('rec').dataset.state = ''; $('try').style.display = ''; say(''); return; }
  begin(true);
};
$('pause').onclick = () => { if (running) { stopScroll(); $('pause').textContent = '▶'; } else startScroll(); };
$('fsm').onclick = () => setFs(+$('fs').value - 4);
$('fsp').onclick = () => setFs(+$('fs').value + 4);
$('spm').onclick = () => adj(-1);
$('spp').onclick = () => adj(1);
$('mode').onchange = $('wpm').oninput = refreshSetup;
</script>
