<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Teleprompter</title>
<style>
:root{--fs:36px;--fg:#ffffff;--bg:#000000;--hl:#ffd23f;--lh:1.35;--mx:20px;--ff:system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}
#setup{display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px 16px;height:100dvh}
#list,#recs{display:flex;flex-direction:column;gap:10px;padding:max(16px,env(safe-area-inset-top)) 16px 16px;height:100dvh}
#items,#recItems{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{text-align:left;background:#111;border:1px solid #333;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.item b{font-size:17px}.item video{width:100%;border-radius:8px;background:#000;max-height:50dvh}.acts{display:flex;gap:8px;margin-top:6px}.acts button{flex:1;padding:8px}.item small{color:#999}
#est{color:#999;font-size:14px;text-align:center}
#empty{color:#999;text-align:center;margin-top:30px}
.head{display:flex;gap:8px}
#title{flex:1;min-width:0;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600}
#script{flex:1;min-height:0;width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;font-size:18px;resize:none}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
input[type=range]{flex:1}
select,button{font:inherit;color:#fff;background:#222;border:1px solid #444;border-radius:12px;padding:12px 16px}
button.main{background:#d22;border-color:#d22;font-weight:600;font-size:18px}
#run{touch-action:none;display:none;position:fixed;inset:0;background:#000}
#cam{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;background:#000}
#ov{position:absolute;left:0;right:0;top:0;height:52dvh;overflow:hidden;pointer-events:none;
  background:linear-gradient(color-mix(in srgb,var(--bg) 70%,transparent) 80%,transparent)}
#rl{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 6dvh);height:calc(var(--fs)*var(--lh));background:rgba(255,255,255,.14);border-block:1px solid rgba(255,255,255,.4);display:none}
#txt{position:relative;padding:calc(env(safe-area-inset-top) + 6dvh) var(--mx) 60dvh;font-size:var(--fs);line-height:var(--lh);font-weight:600;color:var(--fg);font-family:var(--ff);will-change:transform}
#txt span.on{color:var(--hl)}
#txt span.em{text-decoration:underline;text-underline-offset:.15em;font-weight:800}
#look{font-size:15px}#look summary{padding:6px 0;color:#bbb}#look label{margin:8px 0}#look input[type=color]{width:48px;height:32px;padding:0;border:0;background:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  padding:12px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
#bar button{padding:12px 14px;min-width:48px}
#bar button.rec{background:#d22;border-color:#d22;font-weight:600}
#msg{position:absolute;left:12px;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 120px);text-align:center;font-size:14px;color:#ffd23f;text-shadow:0 0 4px #000}
#clk{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 4px);font-size:14px;font-variant-numeric:tabular-nums;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 8px;pointer-events:none;display:none}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;font-weight:700;text-shadow:0 0 20px #000}
</style>
</head>
<body>
<div id="list">
  <div class="head"><button class="main" id="new" style="flex:1" data-i18n="newScript">+ Novo roteiro</button></div>
  <div class="head"><button id="imp" data-i18n="import">Importar</button><button id="tplBtn" data-i18n="templates">Modelos</button><button id="recsBtn" data-i18n="recsTitle">Gravações</button><select id="uil"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select></div>
  <input type="file" id="file" accept=".txt,.docx,.pdf,text/plain" hidden>
  <div id="items"></div>
</div>

<div id="recs" style="display:none">
  <div class="head"><button id="recsBack">‹</button><b data-i18n="recsTitle" style="align-self:center;font-size:18px">Gravações</b></div>
  <div id="recItems"></div>
</div>

<div id="setup" style="display:none">
  <div class="head">
    <button id="toList">‹</button>
    <input id="title" placeholder="Título do roteiro" data-i18n-ph="titlePh">
    <button id="del">🗑</button>
  </div>
  <textarea id="script" placeholder="Cole ou escreva o roteiro aqui" data-i18n-ph="scriptPh"></textarea>
  <label><span data-i18n="mode">Modo</span>
    <select id="mode"><option value="speed" data-i18n="mSpeed">Velocidade</option><option value="time" data-i18n="mTime">Tempo fixo</option><option value="wpm" data-i18n="mWpm">Palavras por minuto</option><option value="speech" data-i18n="mSpeech">Acompanhar minha fala</option></select>
  </label>
  <label><span data-i18n="font">Letra</span> <input id="fs" type="range" min="20" max="80" value="36"></label>
  <label id="rowSp"><span data-i18n="speed">Velocidade</span> <input id="sp" type="range" min="10" max="200" value="60"></label>
  <label id="rowDur"><span data-i18n="durLabel">Duração (mm:ss)</span> <input id="dur" value="2:00" inputmode="numeric" size="6"></label>
  <label id="rowWpm"><span data-i18n="wpmLabel">Palavras/min</span> <input id="wpm" type="number" min="40" max="400" value="140"></label>
  <label id="rowSens"><span data-i18n="sens">Sensibilidade da fala</span> <select id="sens"><option value="0" data-i18n="sRigid">Rígida</option><option value="1" data-i18n="sNormal">Normal</option><option value="2" data-i18n="sLoose">Solta</option></select></label>
  <label id="rowSl"><span data-i18n="slang">Idioma da fala</span> <select id="slang"><option value="pt-BR">Português</option><option value="en-US">English</option><option value="es-ES">Español</option></select></label>
  <div id="est"></div>
  <details id="camset"><summary data-i18n="camera">Câmera</summary>
    <label><span data-i18n="camera">Câmera</span> <select id="ccam"><option value="user" data-i18n="front">Frontal</option><option value="environment" data-i18n="rear">Traseira</option></select></label>
    <label><span data-i18n="res">Resolução</span> <select id="cres"><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select></label>
    <label><span data-i18n="aspect">Proporção</span> <select id="casp"><option value="9:16" data-i18n="a916">9:16 vertical</option><option value="16:9" data-i18n="a169">16:9 horizontal</option><option value="1:1" data-i18n="a11">1:1 quadrado</option></select></label>
    <label><span data-i18n="mic">Microfone</span> <select id="cmic"></select></label>
    <label><span data-i18n="noise">Reduzir ruído</span> <input type="checkbox" id="cnoise" checked></label>
    <label><span data-i18n="echo">Cancelar eco</span> <input type="checkbox" id="cecho" checked></label>
  </details>
  <details id="look"><summary data-i18n="look">Aparência</summary>
    <label><span data-i18n="theme">Tema</span> <select id="theme"><option value="0" data-i18n="th0">Branco no escuro</option><option value="1" data-i18n="th1">Amarelo no escuro</option><option value="2" data-i18n="th2">Preto no branco</option><option value="3" data-i18n="th3">Verde no escuro</option><option value="x" data-i18n="thX">Personalizado</option></select></label>
    <label><span data-i18n="text">Texto</span> <input type="color" id="cfg" value="#ffffff"></label>
    <label><span data-i18n="bg">Fundo</span> <input type="color" id="cbg" value="#000000"></label>
    <label><span data-i18n="hl">Destaque</span> <input type="color" id="chl" value="#ffd23f"></label>
    <label><span data-i18n="lh">Entrelinha</span> <input id="clh" type="range" min="1.1" max="2.2" step="0.05" value="1.35"></label>
    <label><span data-i18n="margins">Margens</span> <input id="cmx" type="range" min="0" max="60" value="20"></label>
    <label><span data-i18n="mh">Espelhar horizontal</span> <input type="checkbox" id="cmh"></label>
    <label><span data-i18n="mv">Espelhar vertical</span> <input type="checkbox" id="cmv"></label>
    <label><span data-i18n="clock">Contador de tempo</span> <input type="checkbox" id="cclk"></label>
    <label><span data-i18n="rl">Linha de leitura</span> <input type="checkbox" id="crl"></label>
    <label><span data-i18n="dys">Fonte para dislexia</span> <input type="checkbox" id="cdys"></label>
  </details>
  <button class="main" id="open" data-i18n="openCam">Abrir câmera</button>
</div>

<div id="run">
  <video id="cam" playsinline muted autoplay></video>
  <div id="ov"><div id="rl"></div><div id="txt"></div></div>
  <div id="clk"></div>
  <div id="count"></div>
  <div id="msg"></div>
  <div id="bar">
    <button id="back">✕</button>
    <button id="flip">⟲</button>
    <button id="fsm">A−</button><button id="fsp">A+</button>
    <button id="spm">−</button><button id="spp">+</button>
    <button id="pause">⏸</button>
    <button id="try" data-i18n="try">Ensaiar</button>
    <button id="cont" data-i18n="take" style="display:none">Novo trecho</button>
    <button id="rec" class="rec" data-i18n="rec">● Gravar</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };

    delConfirm: 'Excluir este roteiro?', durMsg: d => 'Duração ' + d, wpmMsg: w => w + ' palavras/min', speedMsg: v => 'Velocidade ' + v, fontMsg: v => 'Letra ' + v,

    titlePh: 'Script title', scriptPh: 'Paste or write your script here',

    rolling: 'Scrolling', paused: 'Paused', noVoice: 'No speech recognized: scrolling by speed',
    srMissing: "This browser can't recognize speech: scrolling by speed", heardAgain: 'Speech recognized: following you',
    srError: e => 'Recognition: ' + e, srDenied: ' (allow the microphone)', listening: 'Listening… start speaking', srFail: 'Could not start recognition',

  es: {
    newScript: '+ Nuevo guion', import: 'Importar', untitled: 'Sin título', myScript: 'Mi guion',

    sens: 'Sensibilidad de la voz', sRigid: 'Estricta', sNormal: 'Normal', sLoose: 'Suelta', slang: 'Idioma de la voz',

Object.assign(LANGS.es, { recsTitle: 'Grabaciones', noRecs: 'Aún no hay grabaciones guardadas.', play: '▶ Ver', share: 'Compartir', del: '🗑', delRec: '¿Eliminar esta grabación?' });

Object.assign(LANGS.es, { mic: 'Micrófono', micAuto: 'Automático', noise: 'Reducir ruido', echo: 'Cancelar eco' });

Object.assign(LANGS.es, { templates: 'Plantillas', take: 'Nueva toma', takeN: n => `toma ${n}`, clock: 'Contador de tiempo', approx: m => `≈ ${m}` });
const TEMPLATES = {
  pt: [
    ['Vídeo curto (Reels/TikTok)', 'Você sabia que [fato surpreendente]?\n\nA maioria das pessoas [erro comum], e isso custa [consequência].\n\nO segredo é simples: [dica principal].\n\nPrimeiro, [passo 1]. Depois, [passo 2]. Por fim, [passo 3].\n\nSe gostou, segue o perfil e comenta [pergunta] aqui embaixo.'],
    ['Vendas', 'Olá, [nome]! Eu sou [seu nome], da [empresa].\n\nSe você hoje [dor do cliente], sei como isso atrapalha o seu dia.\n\nPor isso criamos [produto], que [principal benefício] em [prazo].\n\nNossos clientes já [resultado concreto].\n\nPara começar hoje, é só [próximo passo]. Posso te ajudar agora?'],
    ['Aula', 'Bem-vindos à aula de hoje: [tema].\n\nAo final, vocês vão saber [objetivo 1] e [objetivo 2].\n\nVamos começar pelo conceito: [definição simples].\n\nUm exemplo prático: [exemplo].\n\nResumindo: [ponto 1], [ponto 2] e [ponto 3]. Na próxima aula vamos ver [próximo tema].'],
    ['Notícia', 'Boa noite. [Manchete em uma frase].\n\nSegundo [fonte], [o que aconteceu], em [local], nesta [dia].\n\n[Detalhe importante 1]. [Detalhe importante 2].\n\nO caso segue em apuração. Voltamos com mais informações em instantes.'],
    ['Discurso / Pregação', 'Irmãos e amigos, boa noite.\n\nHoje quero falar sobre [tema].\n\nEm [texto/ocasião] aprendemos que [mensagem central].\n\nPense em [história ou exemplo].\n\nA pergunta que fica é: [pergunta de reflexão].\n\nQue possamos [aplicação prática]. Muito obrigado.']
  ],
  en: [
    ['Short video (Reels/TikTok)', 'Did you know [surprising fact]?\n\nMost people [common mistake], and it costs them [consequence].\n\nThe secret is simple: [main tip].\n\nFirst, [step 1]. Then, [step 2]. Finally, [step 3].\n\nIf you liked this, follow and tell me [question] in the comments.'],
    ['Sales', "Hi [name]! I'm [your name] from [company].\n\nIf you're currently [customer pain], I know how much that slows your day.\n\nThat's why we built [product], which [main benefit] in [timeframe].\n\nOur customers already [concrete result].\n\nTo start today, just [next step]. Can I help you now?"],
    ['Lesson', "Welcome to today's lesson: [topic].\n\nBy the end, you'll know [goal 1] and [goal 2].\n\nLet's start with the concept: [simple definition].\n\nA practical example: [example].\n\nIn short: [point 1], [point 2] and [point 3]. Next time we'll cover [next topic]."],
    ['News', 'Good evening. [Headline in one sentence].\n\nAccording to [source], [what happened], in [place], on [day].\n\n[Key detail 1]. [Key detail 2].\n\nThe case is still under investigation. We will bring you more shortly.'],
    ['Speech / Sermon', 'Friends, good evening.\n\nToday I want to talk about [topic].\n\nIn [text/occasion] we learn that [central message].\n\nThink of [story or example].\n\nThe question that remains is: [reflection question].\n\nMay we [practical application]. Thank you very much.']

const utf8 = b => new TextDecoder().decode(b);

async function zipEntry(buf, name) {
  const v = new DataView(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error(tr('zipBad'));
  let p = v.getUint32(e + 16, true);
  for (let i = v.getUint16(e + 10, true); i > 0; i--) {
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true);
    if (utf8(new Uint8Array(buf, p + 46, nl)) === name) {
      const lho = v.getUint32(p + 42, true), start = lho + 30 + v.getUint16(lho + 26, true) + v.getUint16(lho + 28, true);
      const data = new Uint8Array(buf, start, v.getUint32(p + 20, true));
      if (v.getUint16(p + 10, true) === 0) return utf8(data);
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    p += 46 + nl + xl + cl;
  }
  throw new Error(tr('zipNone'));
}

async function readDocx(buf) {
  const doc = new DOMParser().parseFromString(await zipEntry(buf, 'word/document.xml'), 'application/xml');
  return Array.from(doc.getElementsByTagName('w:p')).map(p => {
    let s = '';
    p.querySelectorAll('t,tab,br').forEach(n => { s += n.localName === 't' ? n.textContent : n.localName === 'tab' ? ' ' : '\n'; });
    return s;
  }).join('\n');
}

async function readPdf(buf) {
  if (!window.pdfjsLib) {
    await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = ok; s.onerror = () => no(new Error(tr('noNet')));
      document.head.append(s);
    });
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = '';
  for (let i = 1; i <= pdf.numPages; i++) {

// Alinha o fim do que foi ouvido com o roteiro. Usa só sequências de palavras seguidas, então
// repetir o mesmo trecho dá o mesmo resultado e palavra comum solta não faz o texto pular.
// Sensibilidade: far = palavras seguidas exigidas para saltar mais de 12; near = idem perto;
// one = distância máxima aceita com 1 palavra só (0 desliga); len = tamanho mínimo dessa palavra.
const SENS = [{ far: 4, near: 3, one: 0, len: 4 }, { far: 3, near: 2, one: 3, len: 4 }, { far: 3, near: 2, one: 6, len: 3 }];

  for (let j = Math.max(0, idx - 1); j < Math.min(idx + 40, words.length, wall); j++) {
    let score = 0, a = j, b = tail.length - 1;

async function openCam() {
  saveCur(); store('tp.mode', $('mode').value); store('tp.sens', $('sens').value); store('tp.slang', $('slang').value); store('tp.sp', $('sp').value);
  dur = parseDur($('dur').value); $('dur').value = fmtDur(dur); store('tp.dur', $('dur').value);
  wpm = Math.max(40, Math.min(400, +$('wpm').value || 140)); store('tp.wpm', wpm);
  speed = +$('sp').value; setFs(+$('fs').value);
  saveCam();
  if (!await startStream()) return;
  buildText();
  $('setup').style.display = 'none'; $('run').style.display = 'block';
  $('try').style.display = $('rec').style.display = '';
}

function closeCam() {
  stopScroll(); stopSpeech();
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  $('run').style.display = 'none'; $('setup').style.display = 'flex'; $('cont').style.display = 'none';
}

function countdown() {
  return new Promise(res => {
    let n = 3; const c = $('count'); c.style.display = 'flex'; c.textContent = n;
    const i = setInterval(() => { n--; if (n) c.textContent = n; else { clearInterval(i); c.style.display = 'none'; res(); } }, 1000);
  });
}

async function begin(record, keep) {
  if (!keep) buildText();
  if (record) take = keep ? take + 1 : 1;
  $('try').style.display = $('rec').style.display = $('cont').style.display = 'none';
  await countdown();
  if (record) {
    const type = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    chunks = [];
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
      file = new File(chunks, `teleprompter-${Date.now()}${take > 1 ? '-t' + take : ''}.${ext}`, { type: recorder.mimeType });
      dbDo('readwrite', st => st.put({ id: Date.now(), name: file.name, title: (cur?.title || '') + (take > 1 ? ' · ' + tr('takeN', take) : ''), at: Date.now(), size: file.size, type: file.type, blob: file }));
      $('rec').textContent = tr('save'); $('rec').style.display = $('cont').style.display = ''; $('rec').dataset.state = 'save';
      say(tr('recReady'));
    };
    recorder.start(1000);
  }
  if ($('mode').value === 'speech') startSpeech();
  startScroll();
  $('rec').style.display = ''; $('rec').textContent = tr(record ? 'stopRec' : 'stopTry');
  $('rec').dataset.state = record ? 'stop' : 'stopTry';
}

// Gravações ficam no IndexedDB do aparelho (o navegador pode limpá-las se faltar espaço).
const db = new Promise(ok => {
  try {
    const q = indexedDB.open('tp', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('rec', { keyPath: 'id' });
    q.onsuccess = () => ok(q.result); q.onerror = () => ok(null);
  } catch { ok(null); }
});
const dbDo = async (mode, fn) => {
  const d = await db; if (!d) return [];
  return new Promise(ok => { const q = fn(d.transaction('rec', mode).objectStore('rec')); q.onsuccess = () => ok(q.result); q.onerror = () => ok([]); });
};
navigator.storage?.persist?.().catch(() => {});

async function showRecs() {
  $('list').style.display = 'none'; $('recs').style.display = 'flex';
  const box = $('recItems'); box.textContent = '';
  const all = ((await dbDo('readonly', st => st.getAll())) || []).sort((a, b) => b.at - a.at);
  if (!all.length) { const e = document.createElement('div'); e.id = 'empty'; e.textContent = tr('noRecs'); box.append(e); return; }
  all.forEach(r => {
    const it = document.createElement('div'); it.className = 'item';
    const ti = document.createElement('b'); ti.textContent = r.title || r.name;
    const m = document.createElement('small'); m.textContent = `${new Date(r.at).toLocaleString(LOCALE[lang])} · ${r.size < 1048576 ? Math.round(r.size / 1024) + " KB" : (r.size / 1048576).toFixed(1) + " MB"}`;
    const acts = document.createElement('div'); acts.className = 'acts';
    const bp = document.createElement('button'); bp.textContent = tr('play');
    bp.onclick = () => {
      if (it.querySelector('video')) return;
      const v = document.createElement('video'); v.controls = v.playsInline = true; v.src = URL.createObjectURL(r.blob);
      it.insertBefore(v, acts); v.play().catch(() => {});
    };
    const bs = document.createElement('button'); bs.textContent = tr('share');
    bs.onclick = () => save(new File([r.blob], r.name, { type: r.type }));
    const bd = document.createElement('button'); bd.textContent = tr('del');
    bd.onclick = async () => { if (confirm(tr('delRec'))) { await dbDo('readwrite', st => st.delete(r.id)); showRecs(); } };
    acts.append(bp, bs, bd); it.append(ti, m, acts); box.append(it);
  });
}

async function save(f = file) {
  try {
    if (navigator.canShare && navigator.canShare({ files: [f] })) return await navigator.share({ files: [f] });
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click();
}

applyLang();
showList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
$('uil').onchange = () => { lang = $('uil').value; store('tp.lang', lang); store('tp.slang', ''); applyLang(); showList(); };
$('recsBtn').onclick = showRecs;
$('tplBtn').onclick = () => tplOpen ? showList() : showTemplates();
$('recsBack').onclick = showList;
$('open').onclick = openCam;
$('back').onclick = closeCam;
$('flip').onclick = async () => {
  if ($('rec').dataset.state === 'stop') return;
  $('ccam').value = $('ccam').value === 'user' ? 'environment' : 'user';
  saveCam();
  await startStream();
};
$('try').onclick = () => begin(false);
$('cont').onclick = () => begin(true, true);
$('rec').onclick = () => {
  const s = $('rec').dataset.state;
  if (s === 'save') return save();
  if (s === 'stop') { stopScroll(); stopSpeech(); recorder.stop(); return; }
  if (s === 'stopTry') { stopScroll(); stopSpeech(); $('rec').textContent = tr('rec'); $('rec').dataset.state = ''; $('try').style.display = ''; say(''); return; }
  begin(true);
};
$('pause').onclick = () => { if (running) { stopScroll(); $('pause').textContent = '▶'; } else startScroll(); };
$('fsm').onclick = () => setFs(+$('fs').value - 4);
$('fsp').onclick = () => setFs(+$('fs').value + 4);
$('spm').onclick = () => adj(-1);
$('spp').onclick = () => adj(1);
$('mode').onchange = $('wpm').oninput = refreshSetup;
</script>
